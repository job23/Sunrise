name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  release:
    name: Release x64
    # The image carries Visual Studio 2026, so the project's own v145 toolset and its
    # 10.0.26100.0 SDK are both present. No toolset override.
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      # The x86-hosted compiler runs out of heap on the large static tables. Force the x64 host.
      - name: Build
        run: >
          msbuild Sunrise.sln /m
          /p:Configuration=Release
          /p:Platform=x64
          /p:PreferredToolArchitecture=x64
          /verbosity:minimal

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sunrise-Release-x64
          path: |
            build/x64/Release/steam_api64.dll
            build/x64/Release/steam_api64.pdb
          if-no-files-found: error

  macos-cross:
    name: macOS cross-build x64
    # Builds the same DLL with clang-cl + lld-link from an Apple Silicon host, so the macOS
    # and Linux toolchain path stays green alongside the MSVC release.
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: brew install ninja llvm lld xwin

      - name: Cache Windows SDK splat
        id: xwin-cache
        uses: actions/cache@v4
        with:
          path: .xwin-cache
          key: xwin-10.0.26100-${{ runner.os }}-${{ runner.arch }}

      - name: Splat Windows SDK
        if: steps.xwin-cache.outputs.cache-hit != 'true'
        run: >
          xwin --sdk-version 10.0.26100 --accept-license splat
          --include-debug-libs --output .xwin-cache

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=$PWD/unix-to-win-toolchain.cmake
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sunrise-Release-x64-macos-cross
          path: build/x64/Release/steam_api64.dll
          if-no-files-found: error
